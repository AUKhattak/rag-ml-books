[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ml-books"
version = "0.1.0"
description = "RAG pipeline over machine learning textbooks"
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.27.2.3",
    "sentence-transformers",
    "pandas",
    "pyarrow",
    "faiss-cpu",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "__pycache__", "build", "dist", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.format]
quote-style = "double"